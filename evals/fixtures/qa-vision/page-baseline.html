<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><title>Ustawienia — Powiadomienia</title>
<style>
  :root { --accent: #2563eb; --surface:#fff; --border:#e2e8f0; --text:#0f172a; --muted:#64748b; }
  body { margin:0; font-family: system-ui; background:#f8fafc; padding:40px; display:flex; justify-content:center; }
  .card { width:640px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:24px; }
  h1 { font-size:18px; font-weight:600; color:var(--text); margin:0 0 20px; }
  .row { display:flex; align-items:center; justify-content:space-between; padding:14px 0; border-bottom:1px solid var(--border); }
  .row:last-of-type { border-bottom:0; }
  .label { color:var(--text); font-size:14px; font-weight:500; }
  .hint { color:var(--muted); font-size:13px; margin-top:2px; }
  .sw { width:44px; height:24px; border-radius:999px; position:relative; flex:none; }
  .sw.on  { background:var(--accent); }
  .sw.off { background:#cbd5e1; }
  .sw i { position:absolute; top:3px; width:18px; height:18px; border-radius:999px; background:#fff; }
  .sw.on i  { right:3px; }
  .sw.off i { left:3px; }
  .actions { display:flex; justify-content:flex-end; margin-top:20px; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:9px 18px; font:inherit; font-weight:500; cursor:pointer; }
</style></head>
<body>
  <div class="card">
    <h1>Powiadomienia</h1>
    <div class="row">
      <div><div class="label">Powiadomienia e-mail</div><div class="hint">Podsumowanie dzienne o 8:00</div></div>
      <div class="sw on"><i></i></div>
    </div>
    <div class="row">
      <div><div class="label">Alerty w Slacku</div><div class="hint">Tylko błędy krytyczne</div></div>
      <div class="sw off"><i></i></div>
    </div>
    <div class="actions"><button>Zapisz zmiany</button></div>
  </div>
</body></html>
